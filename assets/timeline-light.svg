<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 1199" width="480" height="1199" role="img" aria-labelledby="t d">
<title id="t">Linha do tempo de 2017 a 2026</title>
<desc id="d">MAI/2017: Primeiro repositório no GitHub; ABR/2019: Flutter e Dart entram na stack; FEV/2020: Rocha Contabilidade; MAR/2021: media_social_share; ABR/2022: G R Tecnologia; SET/2025: signalr_ultra; JUN/2026: Linha de produtos GROCHA; 16/10/2026: Cilada! e Cilada 3D nas lojas; 18/10/2026: GR Builder, Tempestivo e Figurino no ar; 05/11/2026: Panteão no Google Play</desc>
<defs><radialGradient id="tmA" cx="18%" cy="0%" r="95%"><stop offset="0" stop-color="#1D4ED8" stop-opacity="0.12"/><stop offset="0.55" stop-color="#E8EEFB" stop-opacity="0"/></radialGradient>
<radialGradient id="tmB" cx="100%" cy="100%" r="80%"><stop offset="0" stop-color="#0E7490" stop-opacity="0.1"/><stop offset="1" stop-color="#F3F6FD" stop-opacity="0"/></radialGradient>
<linearGradient id="tmL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8EEFB"/><stop offset="1" stop-color="#F3F6FD"/></linearGradient>
